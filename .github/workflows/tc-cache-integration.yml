name: Testcase Manager Integration
on:
  push:
    branches: [main]
    paths:
      - 'apps/tc-local-caching/**'
      - 'apps/iris/**'
      - '.github/workflows/tc-cache-integration.yml'
  pull_request:
    paths:
      - 'apps/tc-local-caching/**'
      - 'apps/iris/**'
      - '.github/workflows/tc-cache-integration.yml'
permissions:
  contents: read
jobs:
  linux-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build Manager and Iris verification images
        working-directory: apps/tc-local-caching
        run: docker compose --profile tools build manager verify
      - name: Verify Silo origin, Manager, FD client and actual Iris judging
        working-directory: apps/tc-local-caching
        run: |
          docker compose up -d --wait
          docker compose --profile tools run --rm verify
      - name: Compose diagnostics
        if: failure()
        working-directory: apps/tc-local-caching
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        working-directory: apps/tc-local-caching
        run: docker compose --profile tools down -v
