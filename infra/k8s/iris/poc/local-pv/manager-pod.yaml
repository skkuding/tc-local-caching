# Existing local S3/MinIO and PV setup; apply together with iris-pod.yaml.
apiVersion: v1
kind: Pod
metadata:
  name: tc-manager-local-pv-poc
  namespace: iris
spec:
  restartPolicy: Always
  nodeSelector:
    kubernetes.io/hostname: iris-pv-poc-control-plane
  containers:
    - name: manager
      image: tc-local-caching:dev
      imagePullPolicy: Never
      args: ['serve', '-high', '33554432', '-low', '16777216']
      env:
        - {name: SILO_ENDPOINT, value: 'http://host.docker.internal:9000'}
        - {name: SILO_BUCKET, value: 'codedang-testcase'}
        - {name: SILO_ACCESS_KEY, value: 'skku'}
        - {name: SILO_SECRET_KEY, value: 'skku1234'}
      readinessProbe:
        exec:
          command: ['/tc-cache', 'stats']
      volumeMounts:
        - {name: cache, mountPath: /cache}
        - {name: socket, mountPath: /run/tc-cache}
  volumes:
    - name: cache
      persistentVolumeClaim:
        claimName: iris-tc-local-poc
    - name: socket
      hostPath:
        path: /var/run/tc-cache-poc
        type: DirectoryOrCreate
